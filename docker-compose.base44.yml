services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      # Let Vite accept the preview's external hostname (platform sets this).
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: sh -c "npm install -g bun && bun install && bun run dev -- --host 0.0.0.0 --port 3000"
    restart: unless-stopped

volumes:
  node_modules:
